<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warhammer 40,000 - Registro Códice Galáctico</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #040608;
            --panel-bg: #090d12;
            --panel-border: #1a2332;
            --gold: #cda851;
            --gold-glow: rgba(205, 168, 81, 0.3);
            --text-light: #e2e8f0;
            --text-muted: #718096;
            --faction-accent: #cda851;
            --faction-glow: rgba(205, 168, 81, 0.2);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; background-color: var(--bg-dark);
            color: var(--text-light); font-family: 'Cinzel', serif; line-height: 1.8;
        }
        .header-brand {
            text-align: center; padding: 40px 20px;
            background: linear-gradient(to bottom, #000000, var(--bg-dark));
            border-bottom: 2px solid var(--gold); box-shadow: 0 5px 25px rgba(0,0,0,0.8);
        }
        .header-brand h1 {
            font-size: 3rem; font-weight: 900; letter-spacing: 6px;
            color: var(--gold); text-shadow: 0 0 20px var(--gold-glow); margin: 0 0 10px 0;
        }
        .motto-grimdark {
            font-family: 'Share Tech Mono', monospace; font-size: 1rem; color: #ef4444; letter-spacing: 2px; margin: 0;
        }
        .main-container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        
        /* Terminal UI */
        .terminal-selector {
            background-color: var(--panel-bg); border: 1px solid var(--panel-border);
            padding: 30px; border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .navigation-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .tab-button {
            background-color: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-light); padding: 15px 10px; font-size: 1rem; font-family: 'Cinzel', serif;
            letter-spacing: 1px; cursor: pointer; transition: all 0.3s ease; text-align: center;
        }
        .btn-hum-tab:hover, .btn-hum-tab.active { border-color: #cda851; color: #cda851; background-color: rgba(205, 168, 81, 0.1); }
        .btn-caos-tab:hover, .btn-caos-tab.active { border-color: #dc2626; color: #dc2626; background-color: rgba(220, 38, 38, 0.1); }
        .btn-xen-tab:hover, .btn-xen-tab.active { border-color: #16a34a; color: #16a34a; background-color: rgba(22, 163, 74, 0.1); }
        
        .encyclopedia-view {
            background-color: rgba(4, 6, 8, 0.95); border: 2px solid var(--faction-accent);
            padding: 35px; border-radius: 4px; box-shadow: 0 0 25px var(--faction-glow);
            transition: all 0.4s ease;
        }
        .encyclopedia-title {
            font-size: 1.8rem; color: var(--faction-accent); border-bottom: 2px solid var(--faction-accent);
            padding-bottom: 10px; margin-top: 0; text-shadow: 0 0 10px var(--faction-glow);
        }
        .sub-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-top: 20px; }
        .card {
            background: rgba(255, 255, 255, 0.03); border: 1px solid var(--panel-border);
            padding: 15px; border-left: 3px solid var(--faction-accent);
        }
        .card h4 { margin: 0 0 8px 0; color: var(--faction-accent); }
        .card p { margin: 0; font-size: 0.95rem; color: #cbd5e1; }
    </style>
</head>
<body>
    <header class="header-brand">
        <h1>Warhammer 40,000</h1>
        <p class="motto-grimdark">"EN EL SINIESTRO DESCONTROL DEL FUTURO LEJANO, SOLO HAY GUERRA."</p>
    </header>

    <div class="main-container">
        <section class="terminal-selector">
            <div class="navigation-tabs">
                <button id="btnHum" class="tab-button btn-hum-tab active" onclick="cambiarHojaNavegacion('humanas')">🦅 Imperio Humano</button>
                <button id="btnCaos" class="tab-button btn-caos-tab" onclick="cambiarHojaNavegacion('caos')">🔥 Fuerzas del Caos</button>
                <button id="btnXen" class="tab-button btn-xen-tab" onclick="cambiarHojaNavegacion('xenos')">👽 Amenazas Xenos</button>
            </div>

            <div id="encyclopediaView" class="encyclopedia-view">
                <h2 id="viewTitle" class="encyclopedia-title">Cargando...</h2>
                <p id="viewDesc">...</p>
                <h3>Fuerzas Destacadas</h3>
                <div id="subCardsContainer" class="sub-cards"></div>
            </div>
        </section>
    </div>

    <script>
        const enciclopedia = {
            humanas: {
                title: "REGISTRO IMPERIAL: EL BALUARTE DE LA HUMANIDAD",
                color: "#cda851", glow: "rgba(205, 168, 81, 0.25)",
                desc: "El Imperio del Hombre es una teocracia militar masiva que unifica a millones de planetas bajo el dogma de adoración al Dios-Emperador. Mantiene la civilización mediante disciplina férrea y el sacrificio de mil almas diarias.",
                units: [
                    { name: "Adeptus Astartes", desc: "Super-soldados genéticamente modificados armados con servoarmaduras y bólters." },
                    { name: "Astra Militarum", desc: "La columna vertebral del Imperio: miles de millones de soldados regimientos regulares." },
                    { name: "Inquisición", desc: "Agentes con autoridad absoluta para purgar la herejía y ejecutar 'Exterminatus'." }
                ]
            },
            caos: {
                title: "INFORME DE CORRUPCIÓN: LAS ENTIDADES DE LA DISFORMIDAD",
                color: "#dc2626", glow: "rgba(220, 38, 38, 0.25)",
                desc: "Regidas por los Cuatro Dioses Oscuros (Khorne, Tzeentch, Nurgle y Slaanesh), las fuerzas del Caos buscan corromper la materia y consumir las almas de la galaxia.",
                units: [
                    { name: "Marines del Caos", desc: "Antiguos Astartes traidores modificados por mutaciones de la Disformidad." },
                    { name: "Huestes Demoníacas", desc: "Manifestaciones físicas directas de la energía pura del Inmaterium." },
                    { name: "Cultos Herejes", desc: "Células clandestinas de humanos que adoran a las deidades oscuras." }
                ]
            },
            xenos: {
                title: "ARCHIVO CLASIFICADO: AMENAZAS XENOS",
                color: "#16a34a", glow: "rgba(22, 163, 74, 0.25)",
                desc: "Múltiples especies extraterrestres sin cohesión entre sí. Cada facción lucha brutalmente por el dominio o consumo biológico de la galaxia.",
                units: [
                    { name: "Tiránidos", desc: "Enjambres orgánicos extragalácticos guiados por una Mente Colmena." },
                    { name: "Necrones", desc: "Guerreros inmortales de metal viviente surgidos de un letargo de millones de años." },
                    { name: "Orcos", desc: "Bárbaros alienígenas obsesionados con la guerra perpetua." }
                ]
            }
        };

        function cambiarHojaNavegacion(factionKey) {
            const data = enciclopedia[factionKey];
            if (!data) return;

            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            if (factionKey === 'humanas') document.getElementById('btnHum').classList.add('active');
            if (factionKey === 'caos') document.getElementById('btnCaos').classList.add('active');
            if (factionKey === 'xenos') document.getElementById('btnXen').classList.add('active');

            document.documentElement.style.setProperty('--faction-accent', data.color);
            document.documentElement.style.setProperty('--faction-glow', data.glow);

            document.getElementById('viewTitle').innerText = data.title;
            document.getElementById('viewDesc').innerText = data.desc;

            const cardsContainer = document.getElementById('subCardsContainer');
            cardsContainer.innerHTML = data.units.map(u => `
                <div class="card">
                    <h4>${u.name}</h4>
                    <p>${u.desc}</p>
                </div>
            `).join('');
        }

        // Cargar facción inicial por defecto
        document.addEventListener('DOMContentLoaded', () => cambiarHojaNavegacion('humanas'));
    </script>
</body>
</html>
